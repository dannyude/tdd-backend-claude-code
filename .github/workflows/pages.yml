# Builds the companion site (site/) and publishes it to GitHub Pages.
# This is the only workflow at the repository root. shop-api/.github/workflows/ci.yml is the
# book's CI workflow for *your* shop-api repository (Part 8), and is not run here.
name: Companion site

on:
  push:
    branches: [main]
    paths: [site/**, assets/**, stages/**, validate.sh, book/**, shop-api/.claude/hooks/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fonts and tools
        run: |
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          pip install fonttools brotli
      - name: Build
        run: python3 site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
